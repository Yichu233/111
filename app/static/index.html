<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#5146b8"><link rel="icon" href="data:,">
  <title>爱教学 · 课程工作区</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script>
</head>
<body>
<a class="skip" href="#workspace">跳转到课程查询</a>
<aside class="brand-rail">
  <a class="brand" href="/">爱教学<span>开课与教学档案</span></a>
  <div class="rail-section" aria-current="page">课程工作区</div>
  <div class="role-context"><span id="role-mark" class="role-mark">未选身份</span><h2 id="scope-title">请选择模拟身份</h2><p id="role-task">确认身份后，查阅对应范围的开课。</p><div id="role-tools" class="role-tools" aria-label="当前角色工作入口"></div></div>
  <p class="rail-note">本地模拟 · 只读<br>姓名、课程与记录均为模拟数据。<br>不代表学校正式授权策略。</p>
</aside>
<main id="workspace">
  <header class="page-header"><div><h1>课程工作区</h1><p>从一门课程出发，让教学安排、资料与督导事实清楚相连。</p></div><div class="header-actions"><span class="environment">模拟教学环境</span><button id="focus-mode" class="quiet-button" type="button" aria-expanded="true" aria-controls="course-index">专注阅读</button></div></header>
  <section class="query-section" aria-label="查询范围">
    <div class="field"><label for="identity">模拟身份</label><select id="identity" disabled aria-describedby="scope-detail"><option>正在加载身份…</option></select></div>
    <div class="field"><label for="term">学期</label><select id="term" disabled><option>正在加载学期…</option></select></div>
    <p id="scope-detail">先确认身份，再查询授权开课。</p>
  </section>
  <div id="notice" class="notice hidden" role="alert"></div>
  <section class="workspace-grid" aria-label="开课与关联信息">
    <section id="course-index" class="index-panel" aria-labelledby="list-title">
      <div class="section-heading"><h2 id="list-title"><span id="list-name">可查开课</span> <span id="offering-count" class="count">—</span></h2><span id="result-caption" class="heading-note">等待查询</span></div>
      <div class="table-tools">
        <div class="field search-field"><label for="search">查找开课</label><input id="search" type="search" placeholder="课程名称 / 编号 / 班级 / 教师" disabled></div>
        <div class="field"><label for="teaching-filter">授课方式</label><select id="teaching-filter" disabled><option value="all">全部方式</option><option value="joint">联合授课</option><option value="single">单人授课</option></select></div>
        <div class="field"><label for="sort">排序</label><select id="sort" disabled><option value="id">开课编号</option><option value="course">课程名称</option><option value="class">教学班</option></select></div>
      </div>
      <div id="offering-list" aria-live="polite" aria-busy="false"><div class="empty"><h3>先选择模拟身份</h3><p>确认身份后，按当前范围查询开课。</p></div></div>
      <p class="table-note">每项对应一个教学班的具体开课。联合授课只列一项。</p>
    </section>
    <section class="detail-panel" aria-label="选中开课的详细信息"><div id="detail" aria-live="polite" aria-busy="false"><div class="empty"><h2>开课详情</h2><p>从左侧目录选中一条开课，查看安排与关联内容。</p></div></div></section>
  </section>
  <footer>课程档案与具体开课分别记录；未查询到督导记录不等于未督导。</footer>
</main>
<dialog id="reader" aria-labelledby="reader-title" aria-describedby="reader-context">
  <header class="reader-header"><div><p id="reader-context"></p><h2 id="reader-title">资料阅读</h2></div><button id="reader-close" class="quiet-button" type="button">关闭阅读</button></header>
  <div id="reader-body"></div><footer id="reader-actions"></footer>
</dialog>
</body></html>
