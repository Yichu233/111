<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>爱教学 · 课程工作台</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#workspace">跳转到课程工作台</a>
  <aside class="rail" aria-label="应用导航">
    <a class="brand" href="/" aria-label="爱教学首页"><span class="brand-mark">教</span><span>爱教学<small>教学信息工作台</small></span></a>
    <div class="nav-caption">工作空间</div>
    <div class="nav-active"><span aria-hidden="true">▤</span> 查课程 <span class="nav-dot"></span></div>
    <div class="rail-note"><span class="mini-label">SPRINT 01</span><h2>从一门课程开始</h2><p>课程、开课、资料与督导事实，沿着同一条线索查阅。</p></div>
    <div class="rail-footer"><span class="online-dot"></span> 本地教学原型<small>第15组 · 代号蜂鸟</small></div>
  </aside>
  <div class="shell">
    <header class="topbar"><div class="breadcrumb">教学空间 <span>/</span> <strong>查课程</strong></div><span class="badge">模拟数据 · 只读演示</span></header>
    <main id="workspace">
      <div class="page-heading"><div><p class="eyebrow">COURSE WORKSPACE</p><h1>课程工作台</h1><p class="subtitle">找到本学期开课，查阅教学安排与关联资料。</p></div><div class="cycle"><span>当前阶段</span><strong>Sprint 1 <span>基础查询</span></strong></div></div>
      <section class="filters" aria-label="查询条件">
        <div class="field"><label for="identity">模拟身份</label><select id="identity" disabled><option>正在加载身份…</option></select></div>
        <div class="field semester"><label for="term">学期</label><select id="term" disabled><option>正在加载学期…</option></select></div>
        <div class="scope"><span class="scope-icon" aria-hidden="true">◎</span><div><strong id="scope-title">按身份限定查询范围</strong><span id="scope-detail">所有姓名、资料及记录均为模拟</span></div></div>
      </section>
      <div id="notice" class="notice hidden" role="alert"></div>
      <div class="content-grid">
        <section class="panel offering-panel" aria-labelledby="list-title"><div class="panel-heading"><h2 id="list-title">开课列表 <span id="offering-count" class="count">0</span></h2><span class="muted">选择查看详情</span></div><div id="offering-list" aria-live="polite"><div class="empty">正在加载开课…</div></div></section>
        <section class="panel detail-panel" aria-label="开课详情"><div id="detail" aria-live="polite"><div class="empty detail-empty"><div class="empty-icon" aria-hidden="true">▤</div><h2>选择一条开课</h2><p>课程与本次开课的信息将在这里展示。</p></div></div></section>
      </div>
      <footer class="page-footer"><span>只读查询 · 以具体开课关联资源和记录</span><span>模拟身份选择不代表学校账号认证</span></footer>
    </main>
  </div>
</body>
</html>
